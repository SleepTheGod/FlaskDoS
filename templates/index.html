<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="title">Advanced Hub</div>
            <div class="notification">You are currently using the Free Network</div>
        </header>
        <form action="/attack" method="post">
            <label for="target">Target</label>
            <input type="text" id="target" name="target" placeholder="https://example.com" required>

            <label for="threads">Number of Threads</label>
            <input type="number" id="threads" name="threads" value="100" min="1" max="500" required>

            <button type="submit">Start Attack</button>
        </form>

        {% if message %}
        <div class="message success">{{ message }}</div>
        {% elif error %}
        <div class="message error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
