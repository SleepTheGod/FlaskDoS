<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask DOS Attack</title>
    <style>
        body {
            background-color: #121212;
            color: #00FF00; /* Neon green text */
            font-family: 'Courier New', monospace;
            text-align: center;
            padding: 50px;
        }
        h1, h2 {
            color: #FF0000; /* Red for headings */
            text-transform: uppercase;
            font-size: 2.5em;
        }
        input, button {
            background-color: #333;
            border: 2px solid #00FF00;
            color: #00FF00;
            font-size: 18px;
            padding: 10px;
            margin: 10px;
            width: 300px;
            text-align: center;
        }
        input:focus, button:focus {
            outline: none;
            border-color: #FF0000;
        }
        .error {
            color: #FF0000;
            font-weight: bold;
        }
        .message {
            color: #00FF00;
            font-weight: bold;
        }
        .console-style {
            background-color: #222;
            color: #00FF00;
            font-family: 'Courier New', monospace;
            padding: 20px;
            border: 2px solid #00FF00;
            margin-top: 20px;
            font-size: 14px;
            text-align: left;
        }
        .footer {
            color: #666;
            font-size: 12px;
            position: fixed;
            bottom: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>Flask DOS Attack</h1>
    <h2>Hack the Matrix with Style</h2>
    <form action="/attack" method="POST">
        <label for="target">Target IP/Hostname:</label><br>
        <input type="text" id="target" name="target" required><br>

        <label for="threads">Number of Threads (Default: 10000 for unlimited):</label><br>
        <input type="number" id="threads" name="threads" value="10000" min="1" required><br>

        <button type="submit">Launch Attack</button>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    
    {% if message %}
        <div class="message">{{ message }}</div>
    {% endif %}

    <div class="console-style">
        <p>Welcome to the NTP flood...</p>
        <p>Prepare for the overload!</p>
        <p>Unleashing chaos with unlimited threads...</p>
    </div>

    <div class="footer">
        <p>Powered by Flask | vxunderground Approved</p>
    </div>

</body>
</html>
